<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Form Laptop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<h1 th:text="${pageTitle}">Form Laptop</h1>
<a th:href="@{/admin/laptops}">← Quay lại danh sách Laptop</a>

<form th:action="@{${actionUrl}}" th:object="${laptop}" method="post" enctype="multipart/form-data">
    <div>
        <label>Mã Laptop:</label>
        <input type="text" th:field="*{laptopCode}" required/>
    </div>
    <div>
        <label>Tên Laptop:</label>
        <input type="text" th:field="*{laptopName}" required/>
    </div>
    <div>
        <label>Hãng:</label>
        <input type="text" th:field="*{brand}" required/>
    </div>
    <div>
        <label>CPU:</label>
        <input type="text" th:field="*{cpuInfo}" />
    </div>
    <div>
        <label>RAM:</label>
        <input type="text" th:field="*{ramInfo}" />
    </div>
    <div>
        <label>Giá:</label>
        <input type="number" step="0.01" th:field="*{price}" required/>
    </div>
    <div>
        <label>Trạng thái:</label>
        <select th:field="*{laptopStatus}">
            <option th:value="Available">Available</option>
            <option th:value="Out_Of_Stock">Out of Stock</option>
            <option th:value="Archived">Archived</option>
        </select>
    </div>
    <div>
        <label>Ảnh:</label>
        <input type="file" name="image"/>
        <div th:if="${laptop.imgPath != null}">
            <img th:src="@{/${laptop.imgPath}}" width="150" alt="Laptop Image"/>
        </div>
    </div>
    <div>
        <button type="submit">Lưu</button>
    </div>
</form>
</body>
</html>
