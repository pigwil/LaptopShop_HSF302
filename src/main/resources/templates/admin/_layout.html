<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - TechAdmin'">Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4338ca;
            --primary-color-light: #e0e7ff;
            --primary-color-dark: #3730a3;
            --sidebar-bg: #111827;
            --sidebar-text: #9ca3af;
            --sidebar-text-hover: #ffffff;
            --sidebar-active-bg: #1f2937;
            --content-bg: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #374151;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: var(--content-bg);
            color: var(--text-color);
        }

        .admin-panel {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid #374151;
        }

        .sidebar-nav {
            list-style: none;
            flex-grow: 1;
            margin-top: 1rem;
        }

        .sidebar-nav li a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            margin: 0.25rem 0.5rem;
            text-decoration: none;
            color: var(--sidebar-text);
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .sidebar-nav li a:hover {
            background-color: #374151;
            color: var(--sidebar-text-hover);
        }

        .sidebar-nav li a.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        .sidebar-footer {
            padding: 1.5rem;
            border-top: 1px solid #374151;
        }
        .sidebar-footer a {
            color: var(--sidebar-text);
            text-decoration: none;
            display: block;
            text-align: center;
        }

        /* Main Content */
        .main-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .main-header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-color);
            font-weight: 500;
        }
        .user-menu a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .page-content {
            padding: 2rem;
            flex-grow: 1;
        }
    </style>
    <!-- Block cho CSS tùy chỉnh của từng trang -->
    <th:block th:replace="${custom_css}"></th:block>
</head>
<body>
    <div class="admin-panel" th:fragment="layout(title, content, activePage, custom_css)"> <!-- ĐÃ THÊM custom_css -->
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span>TechAdmin</span>
            </div>
            <ul class="sidebar-nav">
                <li><a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'dashboard' ? 'active' : ''}"><span>📊</span> Dashboard</a></li>
                <li><a th:href="@{/admin/laptops}" th:classappend="${activePage == 'laptops' ? 'active' : ''}"><span>💻</span> Quản lý Sản phẩm</a></li>
                <li><a href="#"><span>📦</span> Quản lý Đơn hàng</a></li>
                <li><a href="#"><span>👥</span> Quản lý Người dùng</a></li>
            </ul>
            <div class="sidebar-footer">
                <a th:href="@{/}">← Quay lại trang chủ</a>
            </div>
        </aside>

        <!-- ==================== MAIN CONTENT WRAPPER ==================== -->
        <div class="main-content-wrapper">
            <header class="main-header">
                <h1 class="page-title" th:text="${title}">Page Title</h1>
                <div class="user-menu" th:if="${session.user != null}">
                    <span>Xin chào, <strong th:text="${session.user.fullName}">Admin</strong></span>
                    <a th:href="@{/logout}">Đăng xuất</a>
                </div>
            </header>

            <main class="page-content">
                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>
</body>
</html>
