<!DOCTYPE html>
<html th:fragment="layout(pageTitle, content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' | Admin Panel'">Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            flex-direction: row;
        }

        .admin-sidebar {
            width: 240px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .admin-sidebar h2 {
            text-align: center;
            color: #ecf0f1;
            margin-top: 0;
            border-bottom: 1px solid #34495e;
            padding-bottom: 15px;
        }

        .admin-sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .admin-sidebar ul li a {
            display: block;
            padding: 12px 15px;
            color: #bdc3c7;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .admin-sidebar ul li a:hover,
        .admin-sidebar ul li a.active {
            background-color: #34495e;
            color: white;
        }

        .admin-user {
            border-top: 1px solid #34495e;
            padding-top: 15px;
            font-size: 14px;
        }

        .admin-user span {
            font-weight: bold;
        }

        .admin-user button {
            width: 100%;
            padding: 8px;
            background-color: #e74c3c;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-user button:hover {
            background-color: #c0392b;
        }

        .admin-content {
            flex-grow: 1;
            margin-left: 240px;
            padding: 30px;
            overflow-y: auto;
            box-sizing: border-box;
            min-height: 100vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        a {
            text-decoration: none;
            color: #007bff;
        }

        a:hover {
            text-decoration: underline;
        }

        .alert-success {
            color: green;
            padding: 10px;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .alert-error {
            color: red;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .admin-sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .admin-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="admin-sidebar">
    <h2>🎮 Admin Panel</h2>
    <ul>
        <li><a th:href="@{/admin/dashboard}">🏠 Dashboard</a></li>
        <li><a th:href="@{/admin/laptops}">💻 Manage Laptops</a></li>
        <li><a th:href="@{/admin/orders}">📦 Manage Orders</a></li>
    </ul>

    <div class="admin-user">
        <p>Hello, <span sec:authentication="name">Admin</span></p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="admin-content">
    <th:block th:replace="${content}"></th:block>
</div>

</body>
</html>
