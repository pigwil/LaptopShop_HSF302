<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Định nghĩa fragment CSS tùy chỉnh -->
    <th:block th:fragment="custom-css">
        <style>
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 1.5rem;
            }
            .stat-card {
                background-color: var(--card-bg);
                padding: 1.5rem;
                border-radius: 12px;
                box-shadow: var(--shadow);
                display: flex;
                align-items: flex-start;
                gap: 1.5rem;
                transition: all 0.3s ease;
            }
            .stat-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            }
            .stat-card .icon {
                font-size: 1.5rem;
                padding: 1rem;
                border-radius: 12px;
                color: #fff;
            }
            .stat-card.sales .icon { background-color: #22c55e; }
            .stat-card.orders .icon { background-color: #3b82f6; }
            .stat-card.products .icon { background-color: #ec4899; }
            .stat-card.users .icon { background-color: #f97316; }

            .stat-card .info p {
                font-size: 0.9rem;
                color: var(--text-light);
                font-weight: 500;
                margin-bottom: 0.25rem;
            }
            .stat-card .info h3 {
                font-size: 1.75rem;
                font-weight: 700;
            }

            .main-widgets {
                margin-top: 2.5rem;
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 1.5rem;
            }
            .widget {
                background-color: var(--card-bg);
                padding: 1.5rem;
                border-radius: 12px;
                box-shadow: var(--shadow);
            }
            .widget h4 { font-size: 1.2rem; margin-bottom: 1rem; }
        </style>
    </th:block>
</head>
<body>

    <!-- Thay thế layout và truyền vào các tham số -->
    <div th:replace="~{admin/_layout :: layout(title='Dashboard', content=~{::.dashboard-content}, activePage='dashboard', custom_css=~{::#custom-css})}">
        
        <div class="dashboard-content">
            <!-- Thẻ thống kê -->
            <div class="stats-grid">
                <div class="stat-card sales">
                    <div class="icon">💰</div>
                    <div class="info">
                        <p>Doanh thu tháng</p>
                        <h3>1.280.000.000 ₫</h3>
                    </div>
                </div>
                <div class="stat-card orders">
                    <div class="icon">📦</div>
                    <div class="info">
                        <p>Đơn hàng mới</p>
                        <h3>152</h3>
                    </div>
                </div>
                <div class="stat-card products">
                    <div class="icon">💻</div>
                    <div class="info">
                        <p>Sản phẩm</p>
                        <h3>56</h3>
                    </div>
                </div>
                <div class="stat-card users">
                    <div class="icon">👥</div>
                    <div class="info">
                        <p>Người dùng</p>
                        <h3>320</h3>
                    </div>
                </div>
            </div>

            <!-- Các widget chính -->
            <div class="main-widgets">
                <div class="widget recent-orders">
                    <h4>Đơn hàng gần đây</h4>
                    <p>Chưa có dữ liệu...</p>
                </div>
                <div class="widget top-products">
                    <h4>Sản phẩm bán chạy</h4>
                    <p>Chưa có dữ liệu...</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
