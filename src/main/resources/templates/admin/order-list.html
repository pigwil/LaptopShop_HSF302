<!DOCTYPE html>
<html th:replace="~{admin/_layout :: layout(
                    pageTitle=${pageTitle},
                    content=~{::content}
                  )}">
<th:block th:fragment="content">

<th:block th:fragment="content">

    <style>
        .filter-nav {
            margin: 15px 0;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 15px;
            text-decoration: none;
            color: #333;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .filter-btn:hover {
            background-color: #e0e0e0;
        }
        .filter-btn.active {
            color: white;
            background-color: #007bff;
            border-color: #007bff;
        }
        .filter-btn.active.confirmed { background-color: #007bff; border-color: #007bff; }
        .filter-btn.active.delivered { background-color: #28a745; border-color: #28a745; }
        .filter-btn.active.cancelled { background-color: #dc3545; border-color: #dc3545; }

        .status-Draft { color: gray; font-weight: bold; }
        .status-Confirmed { color: #007bff; font-weight: bold; }
        .status-Delivered { color: #28a745; font-weight: bold; }
        .status-Cancelled { color: #dc3545; font-weight: bold; }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        .order-table thead {
            background-color: #f8fafc;
        }

        .order-table th {
            padding: 12px 14px;
            font-weight: 600;
            color: #374151;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            background-color: #f9fafb;
        }

        .order-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #111827;
            vertical-align: top;
        }

        .order-table tr:hover {
            background-color: #f9fafb;
            transition: background-color 0.2s ease;
        }

        /* Center các cột dropdown */
        .order-table td form {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dropdown (Status + Payment) */
        .order-table select {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #fff;
            font-size: 14px;
            color: #111827;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .order-table select:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 4px rgba(59, 130, 246, 0.2);
        }

        /* Link View Details */
        .order-table a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #2563eb;
            transition: all 0.2s ease;
        }

        .order-table a:hover {
            background-color: #2563eb;
            color: white;
        }

        /* Cột không có dữ liệu */
        .order-table .empty-row td {
            text-align: center;
            color: gray;
            font-style: italic;
        }

        /* Responsive: Cuộn ngang nếu nhỏ */
        @media (max-width: 900px) {
            .order-table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>

    <h1 th:text="${pageTitle}">Order Management</h1>

    <div class="filter-nav">
        <a th:href="@{/admin/orders(status='All')}" class="filter-btn"
           th:classappend="${currentStatus == 'All' ? 'active' : ''}">
            All
        </a>

        <a th:href="@{/admin/orders(status='Confirmed')}" class="filter-btn"
           th:classappend="${currentStatus == 'Confirmed' ? 'active confirmed' : ''}">
            Pending Confirmation (Confirmed)
        </a>

        <a th:href="@{/admin/orders(status='Delivered')}" class="filter-btn"
           th:classappend="${currentStatus == 'Delivered' ? 'active delivered' : ''}">
            Delivered
        </a>

        <a th:href="@{/admin/orders(status='Cancelled')}" class="filter-btn"
           th:classappend="${currentStatus == 'Cancelled' ? 'active cancelled' : ''}">
            Cancelled
        </a>
        <a th:href="@{/admin/orders(status='Return')}" class="filter-btn"
           th:classappend="${currentStatus == 'Return' ? 'active delivered' : ''}">
            Return
        </a>
    </div>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <table class="order-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Customer Information</th>
            <th>Created Date</th>
            <th>Status</th>
            <th>Payment</th>
            <th>Total Amount</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}" th:if="${order.is_archived == null or order.is_archived == 0}">
            <td th:text="${order.id}">1</td>
            <td>
                <div th:if="${order.createdBy != null}">
                    <strong th:text="${order.createdBy.fullName}">Nguyễn Văn A</strong><br/>
                    <span th:text="${order.createdBy.phone}">0901234567</span><br/>
                    <span th:text="${order.createdBy.address}">TP. Hồ Chí Minh</span>
                </div>
                <div th:if="${order.createdBy == null}">
                    <span>N/A</span>
                </div>
            </td>
            <td th:text="${#temporals.format(order.createdDate, 'dd/MM/yyyy')}">01/01/2024</td>
            <td>
                <form th:action="@{'/admin/orders/' + ${order.id} + '/update-status'}" method="post">
                    <select name="status" onchange="this.form.submit()"
                            th:disabled="${order.orderStatus == T(project.laptopshop.entity.Order.Status).Cancelled}">
                        <option th:each="st : ${T(project.laptopshop.entity.Order.Status).values()}"
                                th:if="${st.name() != 'Draft'}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == order.orderStatus}">
                        </option>
                    </select>
                    <button type="submit" style="display: none;">Save</button>
                </form>
            </td>
            <td>
                <form th:action="@{'/admin/orders/' + ${order.id} + '/update-payment'}" method="post">
                    <select name="payed" onchange="this.form.submit()"
                            th:styleappend="${order.payed ? 'color:green; border-color:green;' : 'color:red; border-color:red;'}"
                            th:disabled="${order.orderStatus == T(project.laptopshop.entity.Order.Status).Cancelled}">
                        <option value="true" th:selected="${order.payed}" style="color:green;">Paid</option>
                        <option value="false" th:selected="${!order.payed}" style="color:red;">Unpaid</option>
                    </select>
                    <button type="submit" style="display: none;">Save</button>
                </form>
            </td>
            <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' ₫'}" class="text-right">
                25,000,000 ₫
            </td>
            <td>
                <a th:href="@{'/admin/orders/' + ${order.id}}">View Details</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(orders)}" class="empty-row">
            <td colspan="7">No orders found.</td>
        </tr>
        </tbody>
    </table>

</th:block>

</html>
