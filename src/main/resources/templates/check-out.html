<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng - TechWorld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --text-color: #212529;
            --body-bg: #f4f6f9;
            --border-radius: 8px;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--body-bg);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .main-header {
            background-color: #fff;
            box-shadow: var(--box-shadow);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .action-btn {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            transition: all 0.3s ease;
        }

        .checkout-container {
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin: 2rem 0;
            padding: 2rem;
        }

        .checkout-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ced4da;
            border-radius: var(--border-radius);
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .text-danger {
            color: var(--danger-color);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: #fff;
            margin-left: 1rem;
        }

        .total-price {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .alert {
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-top: 1rem;
        }

        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: var(--danger-color);
        }
    </style>
</head>
<body>
<!-- Header -->
<header class="main-header">
    <div class="container">
        <div class="header-content">
            <a th:href="@{/}" class="logo">TechWorld</a>
            <div class="header-actions">
                <div th:if="${session.user != null}" class="user-welcome">
                    <span>Xin chào, <strong th:text="${session.user.fullName}">User</strong></span>
                    <a href="/cart" class="action-btn">🛒 Giỏ hàng</a>
                    <a th:if="${session.user.role == T(project.laptopshop.entity.User.Role).ADMIN}"
                       href="/admin/dashboard" class="action-btn">Dashboard</a>
                    <a href="/logout" class="action-btn">Đăng xuất</a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Checkout Content -->
<div class="container">
    <div class="checkout-container">
        <h1 class="checkout-title">Đặt hàng</h1>
        <!-- Form đặt hàng -->
        <form th:action="@{/check-out}" method="post" th:object="${checkoutDTO}">
            <table>
                <thead>
                <tr>
                    <th>Laptop</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, iterStat : ${cartItems}" th:data-price="${item.price}">
                    <td th:text="${item.laptopName}"></td>
                    <td>
                        <input type="number" class="quantity-input" min="1"
                               th:value="${item.quantity}" style="width:60px;">
                    </td>
                    <td class="item-price" th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')} + ' ₫'"></td>

                    <!-- Hidden fields để POST -->
                    <input type="hidden" name="laptopCodes" th:value="${item.laptopCode}">
                    <input type="hidden" class="quantity-hidden" name="quantities" th:value="${item.quantity}">
                </tr>
                </tbody>
            </table>

            <p>Tổng tiền: <span id="totalPrice" th:text="${#numbers.formatDecimal(totalPrice,0,'COMMA',0,'POINT')} + ' ₫'"></span></p>

            <div>
                <label>Địa chỉ giao hàng</label>
                <textarea th:field="*{shippingAddress}" rows="3"></textarea>
                <div th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}" class="text-danger"></div>
            </div>

            <div>
                <label>Phương thức thanh toán</label>
                <input type="text" th:field="*{paymentMethod}" readonly>
            </div>

            <button type="submit" class="btn btn-primary">Đặt hàng</button>
        </form>

        <!-- Hiển thị lỗi chung -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    </div>
</div>
<script>
    const quantityInputs = document.querySelectorAll('.quantity-input');

    function updateTotal() {
        let total = 0;
        quantityInputs.forEach(input => {
            const row = input.closest('tr');
            const unitPrice = parseFloat(row.dataset.price);
            const quantity = parseInt(input.value) || 0;

            // Cập nhật hidden input để submit
            row.querySelector('.quantity-hidden').value = quantity;

            // Cộng dồn vào tổng tiền
            total += unitPrice * quantity;
        });

        // Cập nhật tổng tiền
        document.getElementById('totalPrice').textContent = total.toLocaleString('vi-VN') + ' ₫';
    }

    // Gắn sự kiện input
    quantityInputs.forEach(input => {
        input.addEventListener('input', updateTotal);
        input.addEventListener('change', updateTotal); // dự phòng
    });

    // Khởi tạo khi load page
    updateTotal();
</script>

</body>
</html>
