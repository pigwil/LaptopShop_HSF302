<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử đặt hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Lịch sử đặt hàng</h2>

    <table class="table table-bordered mt-3">
        <thead>
        <tr>
            <th>Mã đơn</th>
            <th>Sản phẩm</th>
            <th>Số lượng</th>
            <th>Ngày đặt</th>
            <th>Trạng thái</th>
            <th>Tổng tiền</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td>
            <span th:each="detail : ${order.orderDetails}">
                <span th:text="${detail.laptop.laptopName}"></span><br/>
            </span>
            </td>
            <td>
            <span th:each="detail : ${order.orderDetails}">
                <span th:text="${detail.quantity}"></span><br/>
            </span>
            </td>

            <td th:text="${#temporals.format(order.createdDate, 'dd/MM/yyyy')}"></td>
            <td th:text="${order.orderStatus}"></td>
            <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></td>
            <td>
                <form th:action="@{/order-history/cancel}" method="post"
                      th:if="${order.orderStatus == T(project.laptopshop.entity.Order.Status).Confirmed || order.orderStatus == T(project.laptopshop.entity.Order.Status).Delivered}">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <button type="submit" class="btn btn-warning"
                            th:text="${order.orderStatus == T(project.laptopshop.entity.Order.Status).Confirmed ? 'Hủy đơn' : ''}">
                    </button>
                </form>
                <span th:if="${order.orderStatus == T(project.laptopshop.entity.Order.Status).Cancelled}">Đã hủy</span>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
